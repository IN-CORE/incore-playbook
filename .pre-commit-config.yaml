repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json

    - repo: https://github.com/pre-commit/mirrors-eslint
      rev: v7.11.0
      hooks:
          - id: eslint
            additional_dependencies: ["eslint@7.11.0", "eslint-config-react-app", "babel-eslint@10.1.0"]
            args: ["--fix", "--config", ".eslintrc.json"]
            files: \.(js|jsx|ts|tsx)$
            exclude: ^build/

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: "2.1.2"
      hooks:
          - id: prettier
            additional_dependencies: ["prettier@2.1.2"]
            args: ["--write", "--config", ".prettierrc"]
            files: \.(js|jsx|json|css|md|ts|tsx)$
            exclude: ^build/

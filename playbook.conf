server {
  listen       80;

  root /usr/share/nginx/html/;

  location /playbook/ {
    root /usr/share/nginx/html/;
    index index.html;
    try_files $uri /playbook/index.html;
  }
  location /playbook/public/ {
    root /usr/share/nginx/html/playbook/;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   html;
  }
}

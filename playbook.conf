server {
  listen       80;

  location /playbook/ {
    root /usr/share/nginx/html/playbook;
    #root /incore-playbook/dist;
    index index.html;
    try_files $uri /index.html;
  }
  location /playbook/public/ {
    root /usr/share/nginx/html/playbook;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   html;
  }
}
